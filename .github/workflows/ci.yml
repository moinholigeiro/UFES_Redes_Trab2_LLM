# Roda a cada push e pull request: validação de configuração, hash e argumentos do llama-server.
name: CI
on:
  push:
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
